    <title>Yhteys</title>
</head>
<body>
    <header>
      <nav>
        <ul>
          <img src="images/logo.png" alt="Yrityksen logo">
          <li><a href="index.html">Etusivu</a></li>
          <li><a href="about.html">Meistä</a></li>

          <img src="images/logo.png" alt="Yrityksen logo">
        </ul>
      </nav>
    </header>

    <main>
        <form>
            <div>
                <label>
                    Auton rekisterinumero:
                    <input type="text"
                    name="reg-num"
                    required
                    required pattern="[A-Za-zÅÄÖåäö]{2,3}[- ]?[0-9]{1,3}">
                </label>
            </div>

            <div>
                <label>
                    Huollon kuvaus:
                    <textarea
                    type="text"
                    name="desc"
                    required
                    placeholder="Kerro lyhyesti mitä pitää huoltaa..."
                    ></textarea>
                    
                </label>
            </div>

            <div>
                <label>
                    Nimi:
                    <input type="text"
                    name="name"
                    required
                    placeholder="Etunimi ja Sukunimi"
                    >
                </label>
            </div>

            <div>
                <label>
                    Puhelin n-ro:
                    <input type="tel"
                    name="tel"
                    required
                    pattern="[0-9+\s-]{6,15}"
                    placeholder="esim. 0401234567"
                    >
                </label>
            </div>

            <div>
                <label>
                    Toivottu päivämäärä:
                    <input type="date"
                    name="date"
                    id="date"
                    required
                    >
                </label>
            </div>


            <script>
                document.getElementById('date').min = new Date().toISOString().split('T')[0];
            </script>

            <button type="submit">Lähetä huoltopyyntö</button>

        </form>
    </main>

        <footer>
            <div>Pertti Hakola, Omistaja ja mekaanikko <img src="images/logo.png" alt="Yrityksen logo"></div>

            <div>&copy; 2026 Autokorjaamo Hakola.</div>
        </footer>
</body>
</html>
